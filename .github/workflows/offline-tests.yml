name: Offline Lua checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lua-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 lua5.1 luajit

      # dist/ ist aus src/ gebaut; der Installer verteilt nur dist/
      - name: dist ist aktuell
        run: lua5.4 tools/build.lua --check

      - name: Groessenbudget je Rolle
        run: lua5.4 tools/budget.lua

      # CC:Tweaked fuehrt Lua 5.1 aus; 5.4 allein akzeptiert Code, der dort scheitert
      - name: Pruefung (Lua 5.4)
        run: lua5.4 tools/check.lua
      - name: Pruefung (Lua 5.1)
        run: lua5.1 tools/check.lua

      - name: Tests (Lua 5.4)
        run: lua5.4 tools/run_tests.lua
      - name: Tests (Lua 5.1)
        run: lua5.1 tools/run_tests.lua
      - name: Tests (LuaJIT)
        run: luajit tools/run_tests.lua

name: Offline Lua checks

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lua-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 lua5.1 luajit

      - name: Syntax check
        run: lua5.4 scripts/check_syntax.lua

      - name: Config checks
        run: lua5.4 scripts/check_configs.lua

      - name: Offline tests
        run: lua5.4 scripts/run_tests.lua

      # CC:Tweaked runs Cobalt (Lua 5.1 semantics); 5.4 alone accepts code that fails there
      - name: Syntax check (Lua 5.1)
        run: lua5.1 scripts/check_syntax.lua

      - name: Offline tests (Lua 5.1)
        run: lua5.1 scripts/run_tests.lua

      - name: Offline tests (LuaJIT)
        run: luajit scripts/run_tests.lua
